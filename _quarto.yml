project:
  type: book
  resources:
    - "*.ipynb"

book:
  title: "Computing Chemistry with Code: A Beginner's Guide "
  author: "Caleb A. Tormey"
  date: "4/30/2026"
  repo-url: "https://github.com/Caleb-Tormey/comp-chem-course"
  repo-branch: master
  repo-actions: [source, issue]
  
  chapters:
    - index.qmd
    
    - part: "Module A: Introduction to Python and Computational Chemistry"
      chapters: 
        - notebooks/Module_A/week_1_introduction.qmd
        - notebooks/Module_A/week_1_physics_chem_review.qmd
        - notebooks/Module_A/week_1_atomic_units.qmd
        - notebooks/Module_A/week_1_python_primer.ipynb
           
    - part: "Module B: Finite Difference Methods for Quantum Mechanics" 
      chapters:
        - notebooks/Module_B/week_2_introduction.qmd
        - notebooks/Module_B/week_2_1D_Quantum.ipynb

    
    - part: "Module C: Solving Hard Problems by Guessing"
      chapters:
        - notebooks/Module_C/week_3_introduction.qmd
        - notebooks/Module_C/week_3_Optimization_1.qmd
        - notebooks/Module_C/week_3_Optimization_2.ipynb
        - notebooks/Module_C/week_3_huckel_lcao.qmd
        - notebooks/Module_C/week_3_HF.ipynb



    
    - part: "Appendices"
      chapters:
        - notebooks/Appendix/appendix_crash_course.qmd
        - notebooks/Appendix/appendix_linear_algebra.qmd
        
    - references.qmd

bibliography: references.bib

format:
  live-html: 
    theme: cosmo
    code-fold: true
    code-tools: true
    toc: true
    code-links:
      - text: "Download Notebook Source"
        icon: file-code
        href: https://github.com/Caleb-Tormey/comp-chem-course/blob/master